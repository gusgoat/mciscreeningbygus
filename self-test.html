<script>
function _showErr(msg){
  var r=document.getElementById('root');
  if(r){ r.innerHTML='<div style="padding:24px;color:#b00020;font-family:system-ui;line-height:1.7">'
    +'เกิดข้อผิดพลาด แสดงผลไม่สำเร็จ<br><small style="color:#555">'+(msg||'')+'</small>'
    +'<br><br>หากเป็นปัญหาการเชื่อมต่อ ให้ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้าใหม่</div>'; }
}
window.addEventListener('error', function(ev){
  _showErr((ev && ev.message) ? ev.message : (ev && ev.target && ev.target.src ? ('โหลดไม่ได้: '+ev.target.src) : ''));
}, true);
window.addEventListener('load', function(){
  if(!(window.React && window.ReactDOM)){ _showErr('โหลดไลบรารี React จากอินเทอร์เน็ตไม่สำเร็จ'); }
});
</script>

<script>
if(!window.storage){
  window.storage={
    async get(k){var v=localStorage.getItem(k);return v==null?null:{key:k,value:v};},
    async set(k,v){localStorage.setItem(k,v);return {key:k,value:v};},
    async delete(k){localStorage.removeItem(k);return {key:k,deleted:true};},
    async list(p){p=p||"";var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p)===0)ks.push(k);}return {keys:ks};}
  };
}
</script>

function CubeFigure({ cells, hue, label }) {

    const polys = [];
    const pts = [];
    sorted.forEach(([x, y, z], idx) => {
        const A = P(x, y, z + 1), B = P(x + 1, y, z + 1), Cc = P(x + 1, y + 1, z + 1), D = P(x, y + 1, z + 1), B2 = P(x + 1, y, z), C2 = P(x + 1, y + 1, z), D2 = P(x, y + 1, z);
        pts.push(A, B, Cc, D, B2, C2, D2);
        const pt = (p) => p.join(",");
        polys.push(React.createElement("g", { key: idx },
            React.createElement("polygon", { points: `${pt(A)} ${pt(B)} ${pt(Cc)} ${pt(D)}`, fill: hue.top, stroke: C.primaryDeep, strokeWidth: "1.1", strokeLinejoin: "round" }),
            React.createElement("polygon", { points: `${pt(D)} ${pt(Cc)} ${pt(C2)} ${pt(D2)}`, fill: hue.left, stroke: C.primaryDeep, strokeWidth: "1.1", strokeLinejoin: "round" }),
            React.createElement("polygon", { points: `${pt(B)} ${pt(Cc)} ${pt(C2)} ${pt(B2)}`, fill: hue.right, stroke: C.primaryDeep, strokeWidth: "1.1", strokeLinejoin: "round" })));
    });
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]), pad = 10;
    const minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad;
    const vbW = Math.max(...xs) - Math.min(...xs) + pad * 2;
    const vbH = Math.max(...ys) - Math.min(...ys) + pad * 2;
    return (React.createElement("div", { className: "flex flex-col items-center rounded-2xl py-2", style: { background: "#f3f7f6", border: `1px solid ${C.line}` } },
        React.createElement("svg", { width: "100%", height: "120", viewBox: `${minX} ${minY} ${vbW} ${vbH}`, preserveAspectRatio: "xMidYMid meet" }, polys),
        React.createElement("span", { className: "text-xs", style: { color: C.muted } }, label)));
}
